name: Build EXE

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build
        run: |
          pip install pyinstaller
          pyinstaller --onefile --windowed --name ScrolldownSimulatorBasic scrolldown_simulator_basic.py

      - uses: actions/upload-artifact@v6
        with:
          name: ScrolldownSimulatorBasic
          path: dist/ScrolldownSimulatorBasic.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/ScrolldownSimulatorBasic.exe --title "Scrolldown Simulator Basic ${{ github.ref_name }}" --generate-notes
